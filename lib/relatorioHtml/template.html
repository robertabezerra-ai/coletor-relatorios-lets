<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Relatório Anual · LETS Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<!--
╔══════════════════════════════════════════════════════════════════════════╗
║  RELATÓRIO ANUAL · LETS MARKETING                                        ║
║  Guia rápido para quem for editar este arquivo (humano ou Claude)        ║
╠══════════════════════════════════════════════════════════════════════════╣
║  1. EDITE APENAS os blocos SECOES e DADOS, mais abaixo.                  ║
║     Tudo fora deles é estrutura e não deve ser alterado.                 ║
║                                                                          ║
║  2. IDENTIDADE LETS — variáveis CSS já definidas em :root                ║
║     --red   #D10A11   destaque, ênfase, palavras em itálico              ║
║     --ink   #1D1D1B   texto e seções escuras                             ║
║     --cream #EEE7D6   seções claras de respiro                           ║
║     Tipografia: Figtree. Títulos em peso 300. Nunca use outra fonte.     ║
║                                                                          ║
║  3. LAYOUT — menu lateral fixo à esquerda (.side) + conteúdo (.main).    ║
║     Em telas menores o menu vira barra superior automaticamente.        ║
║     O logo da LETS aparece UMA única vez, no topo do menu lateral.       ║
║                                                                          ║
║  4. GRAMÁTICA VISUAL — toda seção segue este padrão:                     ║
║     <section class="sec [sec--cream|sec--ink]" id="...">                 ║
║       <div class="wrap">                                                 ║
║         <div class="sec-head reveal">                                    ║
║           <div class="eyebrow"><i>01</i> Rótulo da seção</div>           ║
║           <h2>Título com <em>palavra em vermelho</em></h2>               ║
║           <p class="lead">Frase de contexto.</p>                         ║
║         </div>                                                           ║
║         ... conteúdo ...                                                 ║
║       </div></section>                                                   ║
║                                                                          ║
║  5. COMPONENTES PRONTOS — reutilize, não invente novos:                  ║
║     .kpi-grid > .kpi          blocos de número grande                    ║
║     .grid .g2 .g3 .g4         grades responsivas                         ║
║     .card + .card-h           cartão com cabeçalho                       ║
║     .metric-row               linha métrica/valor/variação               ║
║     .pilar-grid > .pilar      pilares numerados                          ║
║     .deliv-grid > .deliv      entregas: número grande + descrição        ║
║     .team-grid > .person      card de pessoa (foto retrato + nome)       ║
║     .tl > .tl-item            linha do tempo                             ║
║     .clip                     item de clipping de imprensa               ║
║     .bmc + .dumb              comparativo cliente x setor                ║
║     .q + .q-item              coluna de trimestre                        ║
║     .reveal                   anima a entrada ao rolar (adicione sempre) ║
║                                                                          ║
║  6. AO CRIAR UMA SEÇÃO NOVA: use os componentes acima, registre a chave  ║
║     em SECOES, adicione o objeto em REGISTRO e mantenha a alternância    ║
║     de fundos. Consulte GUIA-DE-IDENTIDADE.md.                          ║
╚══════════════════════════════════════════════════════════════════════════╝
-->

<style>
:root{
  --red:#D10A11; --ink:#1D1D1B; --cream:#EEE7D6; --white:#fff;
  --ink-70:rgba(29,29,27,.70); --ink-45:rgba(29,29,27,.46); --ink-12:rgba(29,29,27,.13);
  --cream-70:rgba(238,231,214,.72); --cream-20:rgba(238,231,214,.18);
  --pad:clamp(1.25rem,4.5vw,3.75rem); --maxw:1140px; --s-y:clamp(4rem,9vw,7.5rem);
  --side:clamp(215px,19vw,268px);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Figtree,-apple-system,'Segoe UI',sans-serif;font-weight:300;color:var(--ink);
  background:var(--white);line-height:1.55;font-size:17px;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}

/* ══ ESQUELETO: menu lateral + conteúdo ══ */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.main{min-width:0}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--pad)}
.sec{padding-block:var(--s-y);position:relative}
.sec--cream{background:var(--cream)}
.sec--ink{background:var(--ink);color:var(--cream)}
.sec--ink .lead,.sec--ink .eyebrow{color:var(--cream-70)}

/* ══ MENU LATERAL ══ */
.side{position:sticky;top:0;height:100vh;z-index:70;background:var(--white);
  border-right:1px solid var(--ink-12);display:flex;flex-direction:column;
  padding:2.2rem 1.5rem 1.6rem}
.side-mark{color:var(--red);display:block;flex-shrink:0}
.side-mark svg{height:clamp(30px,2.6vw,36px);width:auto}
.side-cap{margin-top:1.7rem;padding-bottom:1.5rem;border-bottom:1px solid var(--ink-12)}
.side-cap b{display:block;font-weight:500;font-size:.92rem;letter-spacing:-.01em;line-height:1.3}
.side-cap span{display:block;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-45);margin-top:.45rem;font-weight:600}
.side-nav{margin-top:1.4rem;display:flex;flex-direction:column;overflow-y:auto;
  flex:1 1 auto;scrollbar-width:thin}
.side-nav a{position:relative;display:flex;gap:.7rem;align-items:baseline;padding:.52rem 0 .52rem .95rem;
  font-size:.87rem;color:var(--ink-70);text-decoration:none;transition:color .25s}
.side-nav a i{font-style:normal;font-size:.63rem;font-weight:700;color:var(--ink-45);
  min-width:1.5em;font-variant-numeric:tabular-nums;transition:color .25s}
.side-nav a::before{content:"";position:absolute;left:0;top:50%;width:3px;height:0;
  background:var(--red);transform:translateY(-50%);transition:height .3s cubic-bezier(.22,1,.36,1)}
.side-nav a:hover{color:var(--ink)}
.side-nav a.on{color:var(--ink);font-weight:400}
.side-nav a.on i{color:var(--red)}
.side-nav a.on::before{height:58%}
.side-foot{margin-top:auto;padding-top:1.3rem;border-top:1px solid var(--ink-12);
  font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-45);font-weight:600}
.side-prog{height:2px;background:var(--ink-12);margin-top:.75rem}
.side-prog i{display:block;height:100%;width:0;background:var(--red)}

/* ══ TIPOGRAFIA ══ */
h1,h2,h3,h4{font-weight:300;line-height:1.04;letter-spacing:-.028em}
h2{font-size:clamp(2rem,4.6vw,3.5rem);margin-bottom:1.35rem}
h3{font-size:clamp(1.18rem,1.9vw,1.5rem);font-weight:400;letter-spacing:-.012em;line-height:1.2}
em{font-style:italic;color:var(--red);font-weight:300}
.eyebrow{display:flex;align-items:center;gap:.8rem;font-size:.69rem;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink-45);margin-bottom:1.4rem}
.eyebrow i{font-style:normal;color:var(--red);font-weight:700;font-variant-numeric:tabular-nums}
.eyebrow::after{content:"";flex:0 0 36px;height:1px;background:currentColor;opacity:.35}
.lead{font-size:clamp(1rem,1.4vw,1.15rem);color:var(--ink-70);max-width:64ch;font-weight:300}
.sec-head{margin-bottom:clamp(2.3rem,5vw,4rem)}
.subhead{display:flex;align-items:center;gap:.8rem;font-size:.69rem;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink-45);
  margin:clamp(2.75rem,6vw,4.5rem) 0 1.75rem;padding-top:1.6rem;border-top:1px solid var(--ink-12)}
.sec--ink .subhead{color:var(--cream-70);border-color:var(--cream-20)}

/* ══ CAPA ══ */
.hero{background:var(--ink);color:var(--cream);position:relative;overflow:hidden;
  padding-block:clamp(3.5rem,8vw,6.5rem) clamp(3rem,6vw,4.5rem)}
.hero::before{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 90% at 90% 4%,rgba(209,10,17,.30),transparent 58%)}
.hero-in{position:relative;z-index:2;display:grid;grid-template-columns:1.5fr .78fr;
  gap:clamp(2rem,4.5vw,4rem);align-items:end}
.hero .eyebrow{color:var(--cream-70);margin-bottom:1.6rem}
.hero h1{font-size:clamp(2.7rem,7.4vw,5.6rem);letter-spacing:-.045em}
.hero h1 span{display:block}
.hero h1 .ln2{color:var(--red);font-style:italic}
.hero-sub{margin-top:1.8rem;max-width:56ch;color:var(--cream-70);
  font-size:clamp(1rem,1.5vw,1.2rem)}
.hero-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:1.5rem 2rem;
  margin-top:clamp(2.4rem,5vw,3.4rem);padding-top:1.7rem;border-top:1px solid var(--cream-20)}
.hero-meta span{display:block;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--cream-70);margin-bottom:.4rem}
.hero-meta strong{font-weight:400;font-size:.96rem;line-height:1.35;display:block}
.client-slot{aspect-ratio:4/3;background:rgba(238,231,214,.06);border:1px dashed var(--cream-20);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.95rem;
  padding:1.6rem;text-align:center}
.client-slot--filled{background:var(--ink);border-style:solid;border-color:var(--ink);padding:1.9rem}
.client-slot img{max-height:100%;max-width:100%;object-fit:contain}
.client-slot svg{width:42px;height:42px;color:var(--cream-70);opacity:.55}
.client-slot p{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--cream-70);font-weight:600;line-height:1.7}

/* ══ PILARES ══ */
.pilar-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:2rem 1.75rem}
.pilar{border-top:2px solid var(--red);padding-top:1.15rem}
.pilar .n{font-size:.66rem;font-weight:700;letter-spacing:.16em;color:var(--red);
  font-variant-numeric:tabular-nums;display:block;margin-bottom:.85rem}
.pilar h3{font-size:1.16rem;font-weight:500;margin-bottom:.45rem}
.pilar .k{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-45);
  font-weight:600;display:block;margin-bottom:.85rem}
.sec--ink .pilar .k{color:var(--cream-70)}
.pilar p{font-size:.9rem;color:var(--ink-70);line-height:1.5}
.sec--ink .pilar p{color:var(--cream-70)}

/* ══ KPI ══ */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));
  gap:1px;background:var(--ink-12);border-block:1px solid var(--ink-12)}
.kpi{background:var(--white);padding:1.9rem 1.65rem 2rem}
.sec--cream .kpi{background:var(--cream)}
.sec--ink .kpi{background:var(--ink)}
.kpi-grid.tight{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi-label{font-size:.67rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-45);margin-bottom:1.25rem;font-weight:600}
.sec--ink .kpi-label{color:var(--cream-70)}
.kpi-val{font-size:clamp(2.4rem,4.6vw,3.4rem);font-weight:300;letter-spacing:-.05em;line-height:.95;
  display:flex;align-items:baseline;gap:.06em}
.kpi-val i{font-style:italic;color:var(--red);font-size:.5em;font-weight:400}
.kpi-delta{display:inline-flex;align-items:center;gap:.4rem;margin-top:1rem;font-size:.79rem;font-weight:600}
.up{color:#0f7a4a}.down{color:var(--red)}.flat{color:var(--ink-45)}
.sec--ink .up{color:#5fd39b}.sec--ink .flat{color:var(--cream-70)}
.kpi-note{font-size:.82rem;color:var(--ink-70);margin-top:.7rem;line-height:1.5}
.sec--ink .kpi-note{color:var(--cream-70)}

/* ══ GRIDS E CARTÕES ══ */
.grid{display:grid;gap:1.5rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(315px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(285px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(205px,1fr))}
.card{background:var(--white);border:1px solid var(--ink-12);padding:1.75rem}
.sec--ink .card{background:rgba(238,231,214,.045);border-color:var(--cream-20)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  margin-bottom:1.4rem;padding-bottom:.95rem;border-bottom:1px solid var(--ink-12)}
.sec--ink .card-h{border-color:var(--cream-20)}
.card-h h3{font-size:1.08rem;font-weight:500;letter-spacing:0}
.card-h .tag{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700}
.chart-box{position:relative;height:230px}
.metric-row{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
  padding:.72rem 0;border-bottom:1px dashed var(--ink-12);font-size:.89rem}
.sec--ink .metric-row{border-color:var(--cream-20)}
.metric-row:last-child{border:0}
.metric-row b{font-weight:400;font-size:1.18rem;letter-spacing:-.02em}
.metric-row .d{font-size:.74rem;font-weight:700;margin-left:.5rem}

/* ══ ENTREGAS ══ */
.deliv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(275px,1fr));
  gap:.25rem 2.5rem}
.deliv{display:flex;align-items:baseline;gap:1.1rem;padding:1.05rem 0;
  border-bottom:1px solid var(--cream-20)}
.deliv b{font-size:clamp(1.9rem,3vw,2.4rem);font-weight:300;letter-spacing:-.05em;
  min-width:3.2em;text-align:right;flex-shrink:0;line-height:1}
.deliv b i{font-style:italic;color:var(--red);font-size:.48em}
.deliv span{color:var(--cream-70);font-size:.92rem;line-height:1.45}

/* ══ PESSOAS (padrão do site) ══ */
.team-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.6rem 1.3rem}
.person{display:flex;flex-direction:column;min-width:0}
.person figure{aspect-ratio:3/4;overflow:hidden;background:rgba(29,29,27,.06);margin-bottom:.85rem}
.sec--ink .person figure{background:rgba(238,231,214,.08)}
.person img{width:100%;height:100%;object-fit:cover;object-position:top center;
  filter:grayscale(1) contrast(1.03);transition:filter .45s ease,transform .6s cubic-bezier(.22,1,.36,1)}
.person:hover img{filter:none;transform:scale(1.035)}
.person strong{font-weight:500;font-size:.94rem;letter-spacing:-.01em;line-height:1.25}
.person span{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red);
  font-weight:600;margin-top:.35rem}
.person small{font-size:.76rem;color:var(--cream-70);margin-top:.28rem;line-height:1.35}
.sec:not(.sec--ink) .person small{color:var(--ink-70)}

/* ══ LINHA DO TEMPO ══ */
.tl-item{position:relative;padding-left:clamp(1.6rem,3.5vw,2.6rem);padding-bottom:clamp(2.4rem,5vw,3.6rem)}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:0;top:.5rem;width:11px;height:11px;
  background:var(--red);border-radius:50%}
.tl-item::after{content:"";position:absolute;left:5px;top:1.55rem;bottom:0;width:1px;background:var(--ink-12)}
.tl-item:last-child::after{display:none}
.tl-when{font-size:.67rem;letter-spacing:.18em;text-transform:uppercase;color:var(--red);
  font-weight:700;margin-bottom:.55rem}
.tl-body{display:grid;grid-template-columns:1.35fr .95fr;gap:clamp(1.4rem,3vw,2.4rem);align-items:start}
.tl-body figure{aspect-ratio:4/3;overflow:hidden;background:rgba(29,29,27,.06)}
.tl-body img{width:100%;height:100%;object-fit:cover}
.tl-res{display:block;margin-top:1rem;font-size:.85rem;font-weight:500;
  border-left:2px solid var(--red);padding-left:.9rem;line-height:1.5}

/* ══ IMPRENSA ══ */
.clip{display:grid;grid-template-columns:auto 1fr auto;gap:1.4rem;align-items:baseline;
  text-decoration:none;padding:1.25rem 0;border-bottom:1px solid var(--ink-12);transition:.25s}
.sec--ink .clip{border-color:var(--cream-20)}
.clip:hover{background:rgba(209,10,17,.035);padding-inline:.75rem}
.clip .v{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--red);
  font-weight:700;min-width:9em}
.clip .t{font-size:1rem;font-weight:400;line-height:1.35}
.clip .d{font-size:.75rem;color:var(--ink-45);white-space:nowrap}
.sec--ink .clip .d{color:var(--cream-70)}

/* ══ RANKINGS ══ */
.rk{border-top:2px solid var(--red);padding-top:1.1rem;display:flex;flex-direction:column;gap:.38rem}
.rk .n{font-weight:500;font-size:1.02rem;letter-spacing:-.01em}
.rk .c{font-size:.85rem;color:var(--cream-70);line-height:1.4}
.rk .lv{font-size:.63rem;letter-spacing:.16em;text-transform:uppercase;color:var(--red);
  font-weight:700;margin-top:.3rem}

/* ══ BENCHMARK · comparativo em pares ══ */
.bmc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));
  gap:1px;background:var(--ink-12);border-block:1px solid var(--ink-12)}
.bmc{background:var(--white);padding:1.85rem 1.6rem 1.7rem;display:flex;flex-direction:column}
.sec--cream .bmc{background:var(--cream)}
.bmc-m{font-size:.67rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-45);
  font-weight:600;line-height:1.5;min-height:3em;margin-bottom:1.1rem}
.bmc-x{font-size:clamp(2.7rem,5vw,3.6rem);font-weight:300;letter-spacing:-.05em;line-height:.92;
  display:flex;align-items:baseline;gap:.04em}
.bmc-x i{font-style:italic;color:var(--red);font-size:.46em;font-weight:400}
.bmc-cap{font-size:.79rem;color:var(--ink-70);margin-top:.6rem;line-height:1.4}
.bmc-cap b{font-weight:600;color:var(--ink)}
.dumb{position:relative;height:30px;margin-top:auto;padding-top:1.9rem}
.dumb-in{position:absolute;left:6px;right:6px;top:1.9rem;bottom:0}
.dumb-base{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--ink-12);transform:translateY(-50%)}
.dumb-fill{position:absolute;top:50%;height:2px;width:0;background:var(--red);
  transform:translateY(-50%);transition:width .95s cubic-bezier(.22,1,.36,1) .1s}
.dumb-dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;
  transform:translate(-50%,-50%);opacity:0;transition:opacity .5s ease .3s}
.dumb-dot.ds{background:var(--white);border:2px solid rgba(29,29,27,.32)}
.sec--cream .dumb-dot.ds{background:var(--cream)}
.dumb-dot.dc{background:var(--red);box-shadow:0 0 0 4px rgba(209,10,17,.14)}
.dumb.go .dumb-dot{opacity:1}
.dumb-vals{display:flex;justify-content:space-between;gap:1rem;margin-top:.75rem;
  font-size:.75rem;color:var(--ink-45);font-weight:600;letter-spacing:.04em}
.dumb-vals b{color:var(--red);font-weight:700}
.bmc-leg{display:flex;gap:1.6rem;font-size:.73rem;color:var(--ink-45);margin-top:1.6rem}
.bmc-leg span{display:inline-flex;align-items:center;gap:.5rem}
.bmc-leg span::before{content:"";width:11px;height:11px;border-radius:50%}
.bmc-leg .lc::before{background:var(--red)}
.bmc-leg .ls::before{background:transparent;border:2px solid rgba(29,29,27,.32)}

/* ══ PLANEJAMENTO ══ */
.q{border-top:2px solid var(--red);padding-top:1.25rem}
.q h4{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;
  color:var(--red);margin-bottom:1.25rem}
.q-item{padding:.9rem 0;border-bottom:1px solid var(--ink-12)}
.q-item:last-child{border:0}
.q-item strong{display:block;font-weight:500;font-size:.94rem;margin-bottom:.26rem;letter-spacing:-.01em}
.q-item span{font-size:.83rem;color:var(--ink-70);line-height:1.45;display:block}
.q-item em{font-style:normal;display:inline-block;font-size:.61rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-45);border:1px solid var(--ink-12);
  padding:.15rem .48rem;margin-top:.55rem;font-weight:600}

/* ══ PERGUNTAS PERSONALIZADAS — segue o padrão .card, só acrescenta o que
   .card não cobre: caixa de imagem e marcador de lista ══ */
.pc-img{aspect-ratio:4/3;overflow:hidden;background:rgba(29,29,27,.06);margin-bottom:1rem}
.pc-img img{width:100%;height:100%;object-fit:cover}
.pc-list{list-style:none;display:flex;flex-direction:column;gap:.6rem}
.pc-list li{position:relative;padding-left:1.1rem;font-size:.92rem;color:var(--ink-70);line-height:1.5}
.pc-list li::before{content:"";position:absolute;left:0;top:.6rem;width:9px;height:1px;background:var(--red)}

/* ══ FECHAMENTO ══ */
.end{max-width:880px}
.end p{font-size:clamp(1.35rem,3.2vw,2.3rem);font-weight:300;line-height:1.28;
  letter-spacing:-.03em;color:var(--cream)}
.end .sign{margin-top:2.6rem;padding-top:1.5rem;border-top:1px solid var(--cream-20);
  font-size:.85rem;color:var(--cream-70)}
.foot{background:var(--ink);color:var(--cream-70);padding-block:2.2rem;
  border-top:1px solid var(--cream-20);font-size:.77rem}
.foot-in{display:flex;flex-wrap:wrap;gap:1rem 2rem;justify-content:space-between;align-items:center}

.reveal{opacity:0;transform:translateY(24px);
  transition:opacity .8s ease,transform .8s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:none}

/* ══ RESPONSIVO ══ */
@media(max-width:1080px){
  html{scroll-padding-top:74px}
  .shell{display:block}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;gap:1.25rem;
    padding:.7rem var(--pad);border-right:0;border-bottom:1px solid var(--ink-12);
    background:rgba(255,255,255,.93);backdrop-filter:saturate(1.4) blur(16px)}
  .side-mark svg{height:24px}
  .side-cap,.side-foot{display:none}
  .side-nav{flex-direction:row;margin:0 0 0 auto;overflow-x:auto;overflow-y:hidden;
    flex:0 1 auto;gap:1.15rem;scrollbar-width:none}
  .side-nav::-webkit-scrollbar{display:none}
  .side-nav a{padding:.25rem 0;font-size:.8rem;white-space:nowrap;
    border-bottom:1.5px solid transparent}
  .side-nav a i{display:none}
  .side-nav a::before{display:none}
  .side-nav a.on{border-color:var(--red)}
}
@media(max-width:820px){
  .hero-in{grid-template-columns:1fr}
  .client-slot{order:-1;aspect-ratio:16/7}
  .tl-body{grid-template-columns:1fr}
  .clip{grid-template-columns:1fr;gap:.28rem}
  .clip .v{min-width:0}
  .team-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  body{font-size:16px}
}
@media(max-width:520px){ .team-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }

@media print{
  .side{display:none}
  .shell{display:block}
  .reveal{opacity:1!important;transform:none!important}
  .sec{padding-block:2rem;break-inside:avoid}
  .hero{padding-block:2.5rem}

  .dumb-fill,.dumb-dot{transition:none}
}

<script>

const RED="#D10A11", INK="#1D1D1B", CREAM="#EEE7D6";

const nf  = n => Number(n).toLocaleString("pt-BR");

/* ---------- espaços reservados de imagem ---------- */
function PH(txt,w,h,dark){
  w=w||900;h=h||675;
  const bg=dark?INK:"#E3DCCB", fg=dark?CREAM:INK;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
  <rect width="${w}" height="${h}" fill="${bg}"/>
  <circle cx="${w*.84}" cy="${h*.18}" r="${h*.45}" fill="${RED}" opacity=".13"/>
  <rect x="${w*.07}" y="${h*.52}" width="${w*.11}" height="3" fill="${RED}"/>
  <text x="${w*.07}" y="${h*.66}" font-family="Figtree,sans-serif" font-size="${Math.round(h*.072)}"
    font-weight="300" fill="${fg}" opacity=".7">${esc(txt)}</text>
  <text x="${w*.07}" y="${h*.755}" font-family="Figtree,sans-serif" font-size="${Math.round(h*.038)}"
    font-weight="600" letter-spacing="3" fill="${fg}" opacity=".38">IMAGEM A SUBSTITUIR</text></svg>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
function AV(nome){
  const ini=String(nome).split(" ").filter(Boolean).slice(0,2).map(p=>p[0]).join("").toUpperCase();
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800">
  <rect width="600" height="800" fill="#E3DCCB"/>
  <text x="300" y="400" font-family="Figtree,sans-serif" font-size="190" font-weight="300"
   fill="${INK}" opacity=".42" text-anchor="middle" dominant-baseline="central">${ini}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
const IMG=(src,alt,w,h,dark)=>`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy"
  onerror="this.onerror=null;this.src=PH(${JSON.stringify(String(alt))},${w||900},${h||675},${dark?1:0})">`;

  return {nome,papel,inst,foto};
}

/* ---------- variações ---------- */
function delta(v){
  if(v===null||v===undefined||v==="") return "";
  const n=parseFloat(v), c=n>0?"up":(n<0?"down":"flat"), a=n>0?"▲":(n<0?"▼":"—");
  return `<span class="kpi-delta ${c}">${a} ${nf(Math.abs(n))}% vs ${D.cliente.anoAnterior}</span>`;
}

    </div>
  </div>
  ${clientSlot()}
</div></header>`;

const SECS = ATIVAS.map((s,i)=>{
  const cls = s._bg==="ink" ? " sec--ink" : (s._bg==="cream" ? " sec--cream" : "");
  return `<section class="sec${cls}" id="${s.id}"><div class="wrap">${s.build(i+1)}</div></section>`;
}).join("");

const FOOT = `<footer class="foot"><div class="wrap foot-in">
  <span>Resultados ${D.cliente.ano} · Plano ${D.cliente.ano+1} · ${esc(D.cliente.nome)}</span>
  <span>Documento confidencial · LETS Marketing</span>
  <span>letsmarketing.com.br</span></div></footer>`;

document.getElementById("app").innerHTML =
  `<div class="shell">${SIDE}<div class="main">${HERO}${SECS}${FOOT}</div></div>`;
document.title = `Resultados ${D.cliente.ano} · ${D.cliente.nome} · LETS Marketing`;

/* ---------- gráficos ---------- */
if(window.Chart){
  Chart.defaults.font.family="Figtree, sans-serif";
  Chart.defaults.font.size=11;
  const escuro = id => BG[id]==="ink";
  const tick = d => d ? "rgba(238,231,214,.55)" : "rgba(29,29,27,.48)";
  const grid = d => d ? "rgba(238,231,214,.13)" : "rgba(29,29,27,.08)";
  const opts = d => ({responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},
      tooltip:{backgroundColor:d?CREAM:INK,titleColor:d?INK:CREAM,bodyColor:d?INK:CREAM,
        padding:11,cornerRadius:0,displayColors:false,titleFont:{weight:"600"},bodyFont:{weight:"400"}}},
    scales:{x:{grid:{display:false},border:{display:false},
               ticks:{color:tick(d),maxRotation:0,autoSkipPadding:12}},
            y:{grid:{color:grid(d)},border:{display:false},
               ticks:{color:tick(d),maxTicksLimit:5,
                 callback:v=>v>=1000?(v/1000).toLocaleString("pt-BR")+"k":v}}}});
  const fill=(ctx,cor)=>{const g=ctx.createLinearGradient(0,0,0,230);
    g.addColorStop(0,cor+"3D");g.addColorStop(1,cor+"00");return g;};

  if(SECOES.digital!==false){
    const d=escuro("digital"), st=D.digital.site;
    const cs=document.getElementById("ch-site").getContext("2d");
    const o=opts(d); o.plugins.legend={display:true,align:"end",
      labels:{color:tick(d),boxWidth:14,boxHeight:2,usePointStyle:false,font:{size:11}}};
    new Chart(cs,{type:"line",data:{labels:D.meses,datasets:[
      {label:String(D.cliente.ano),data:st.serieAtual,borderColor:RED,backgroundColor:fill(cs,RED),
       fill:true,tension:.34,borderWidth:2,pointRadius:0,pointHoverRadius:5},
      {label:String(D.cliente.anoAnterior),data:st.serieAnterior,
       borderColor:d?"rgba(238,231,214,.45)":"rgba(29,29,27,.38)",borderDash:[4,4],fill:false,
       tension:.34,borderWidth:1.5,pointRadius:0,pointHoverRadius:5}]},options:o});
    D.digital.canais.forEach((c,i)=>{
      const cx=document.getElementById("ch-c"+i).getContext("2d");
      new Chart(cx,{type:"line",data:{labels:D.meses,datasets:[{data:c.serie,borderColor:RED,
        backgroundColor:fill(cx,RED),fill:true,tension:.34,borderWidth:2,pointRadius:0,pointHoverRadius:5}]},
        options:opts(d)});
    });
  }
  if(SECOES.imprensa!==false){
    const d=escuro("imprensa");
    new Chart(document.getElementById("ch-imp"),{type:"bar",
      data:{labels:D.meses,datasets:[{data:D.imprensa.porMes,backgroundColor:RED,
        hoverBackgroundColor:d?CREAM:INK,borderRadius:0,barPercentage:.6}]},options:opts(d)});
  }
}

/* ---------- interações ---------- */
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.06});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));

function animaDumb(el){
  const a=parseFloat(el.dataset.a), b=parseFloat(el.dataset.b);
  const f=el.querySelector(".dumb-fill");
  f.style.left=Math.min(a,b)+"%"; f.style.width=Math.abs(b-a)+"%";
  el.classList.add("go");
}
const bio=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){animaDumb(e.target);bio.unobserve(e.target);}}),{threshold:.4});
document.querySelectorAll(".dumb").forEach(el=>bio.observe(el));

const prg=document.getElementById("prg");
const links=[...document.querySelectorAll(".side-nav a")];
const alvos=NAV.map(([id])=>document.getElementById(id));
addEventListener("scroll",()=>{
  const h=document.documentElement;
  prg.style.width=(h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight)*100)+"%";
  let at=-1; alvos.forEach((s,i)=>{if(s&&s.getBoundingClientRect().top<=140)at=i;});
  links.forEach((l,i)=>l.classList.toggle("on",i===at));
},{passive:true});

window.addEventListener("beforeprint",()=>{
  document.querySelectorAll(".reveal").forEach(e=>e.classList.add("in"));
  document.querySelectorAll(".dumb").forEach(animaDumb);});
</script>
</body>
</html>
